services:
  eventrag-neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26-community}
    container_name: rag-graph-demo-eventrag-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    environment:
      NEO4J_AUTH: ${EVENTRAG_NEO4J_USER:-neo4j}/${EVENTRAG_NEO4J_PASSWORD:-eventrag-change-me}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - ./data/eventrag/neo4j/data:/data
      - ./data/eventrag/neo4j/logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:7474 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
