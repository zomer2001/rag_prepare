[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-graph-demo"
version = "0.1.0"
description = "Local LightRAG demo with Qdrant, Docling, DeepSeek, and citations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "docling>=2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "lightrag-hku==1.5.3",
  "langgraph>=1.2,<2",
  "json-repair>=0.61,<1",
  "neo4j>=5.28,<7",
  "openai>=1.90,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.18,<2",
  "rdflib>=7.1,<8",
  "sentence-transformers>=5,<6",
  "streamlit>=1.45,<2",
  "tqdm>=4.67,<5",
  "uvicorn[standard]>=0.34,<1",
  "pyshacl>=0.30,<1",
]

[project.optional-dependencies]
evaluation = [
  "datasets>=3,<5",
  "langchain-text-splitters>=0.3,<2",
  "networkx>=3,<4",
  "rank-bm25>=0.2.2,<1",
  "tiktoken>=0.9,<1",
]
eventrag = [
  "colorama>=0.4.6,<1",
  "joblib>=1.4,<2",
  "nano-vectordb>=0.0.4.3,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_graph_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", ".venv", "qdrant_storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
