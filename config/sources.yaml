# Source registry for the Anduril OSINT collection pipeline.
# Every policy block records WHEN robots/ToS were last checked by a human/agent.
# Keys are read only from environment variables; never put secrets here.
sources:
  - source_id: anduril_official
    name: Anduril Industries official site
    publisher: Anduril Industries
    authority_tier: P0
    record_type: official_page
    adapter: anduril_site
    adapter_version: 1.0.0
    enabled: true
    groups: [p0]
    schedule_hint: daily
    fixture_dir: anduril_official
    entry:
      sitemap: https://www.anduril.com/sitemap.xml
      # Product seeds are query hints only, NOT a closed allowlist (brief §2.2).
      product_seeds:
        - lattice
        - ghost
        - roadrunner
        - roadrunner-m
        - sentry
        - anvil
        - dive-ld
        - fury
        - barracuda
        - altius
        - pulsar
        - menace
        - copperhead
        - iris
        - arsenal
    policy:
      robots_url: https://www.anduril.com/robots.txt
      robots_checked_at: "2026-08-03"  # verified: "User-agent: * Disallow:" (all allowed)
      allowed_methods: [GET]
      rate_limit_seconds: 2.0
      max_concurrency: 1
      auth: none
      content_license: "© Anduril Industries; research copy only, no redistribution"
      notes: >
        Next.js site; sitemap carries Google News namespace with titles and
        publication dates. Prefer __NEXT_DATA__/JSON-LD when present.

  - source_id: usaspending
    name: USAspending award data
    publisher: U.S. Department of the Treasury / USAspending
    authority_tier: P0
    record_type: contract
    adapter: usaspending
    adapter_version: 1.0.0
    enabled: true
    groups: [p0]
    schedule_hint: daily
    fixture_dir: usaspending
    entry:
      search_url: https://api.usaspending.gov/api/v2/search/spending_by_award/
      detail_url_template: https://api.usaspending.gov/api/v2/awards/{internal_id}/
      recipient_aliases:
        - Anduril Industries
      default_since: "2017-06-01"
    policy:
      robots_checked_at: "2026-08-03"  # public API, documented, keyless
      tos_url: https://www.usaspending.gov/about
      tos_checked_at: "2026-08-03"
      allowed_methods: [GET, POST]
      rate_limit_seconds: 2.0
      max_concurrency: 1
      auth: none
      content_license: "U.S. Government work / public data"
      notes: >
        spending_by_award paginates via page + page_metadata.hasNext; detail
        endpoint separates potential value (ceiling) from obligation/outlay.
        Award identity = generated_internal_id.

  - source_id: openalex
    name: OpenAlex scholarly works
    publisher: OpenAlex (OurResearch)
    authority_tier: P0
    record_type: paper
    adapter: openalex
    adapter_version: 1.0.0
    enabled: true
    groups: [p0]
    schedule_hint: weekly
    fixture_dir: openalex
    entry:
      works_url: https://api.openalex.org/works
      affiliation_terms:
        - Anduril Industries
      per_page: 50
      # mailto: set your contact to join the polite pool
    policy:
      robots_checked_at: "2026-08-03"  # REST API documented at docs.openalex.org
      tos_url: https://docs.openalex.org/how-to-use-the-api/rate-limits-and-authentication
      tos_checked_at: "2026-08-03"
      allowed_methods: [GET]
      rate_limit_seconds: 1.0
      max_concurrency: 1
      auth: none
      content_license: "CC0 metadata; article PDFs only when OA license verified"
      notes: >
        Affiliation-first search (raw_affiliation_strings.search). A naive
        full-text search hits the unrelated MATLAB toolbox "ANDURIL".

  - source_id: patentsview
    name: PatentsView (USPTO) patents
    publisher: USPTO / PatentsView
    authority_tier: P0
    record_type: patent
    adapter: patentsview
    adapter_version: 1.0.0
    enabled: true
    groups: [p0]
    schedule_hint: weekly
    fixture_dir: patentsview
    entry:
      api_url: https://search.patentsview.org/api/v1/patent/
      assignee_terms:
        - Anduril Industries
        - Anduril Industries, Inc.
    policy:
      robots_checked_at: "2026-08-03"
      tos_url: https://patentsview.org/apis/api-query-language
      tos_checked_at: "2026-08-03"
      allowed_methods: [GET]
      rate_limit_seconds: 2.0
      max_concurrency: 1
      auth: api_key_env
      requires_api_key: true
      api_key_env: PATENTSVIEW_API_KEY
      content_license: "USPTO open data"
      notes: >
        Legacy api.patentsview.org query API is decommissioned (301 to USPTO
        Open Data Portal, verified 2026-08-03). New search API needs a free
        X-Api-Key. Without a key the adapter policy-skips; Google Patents is
        used for discovery/manual reading only, not bulk scraping.

  - source_id: defense_news
