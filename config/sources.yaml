  - source_id: defense_news_archive
    name: Defense News historical sitemap backfill
    publisher: Defense News
    authority_tier: P1
    record_type: news
    adapter: sitemap_archive
    adapter_version: 1.0.0
    enabled: true
    groups: [archive, news_archive]
    schedule_hint: manual
    entry:
      sitemaps:
        - https://www.defensenews.com/arc/outboundfeeds/sitemap-index/?outputType=xml
      url_keywords: &anduril_url_keywords
        - anduril
      include_prefixes:
        - https://www.defensenews.com/
      exclude_url_parts: [/search/, /preview/]
      max_sitemaps: 20
    policy:
      robots_url: https://www.defensenews.com/robots.txt
      robots_checked_at: "2026-08-03"
      allowed_methods: [GET]
      rate_limit_seconds: 3.0
      max_concurrency: 1
      auth: none
      content_license: "Defense News copyright; research copy only, no redistribution"
      notes: "Uses publisher-declared sitemap; never calls robots-disallowed /search/."

