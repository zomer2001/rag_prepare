    authority_tier: P1
    record_type: news
    adapter: rss_feed
    adapter_version: 1.0.0
    enabled: true
    groups: [p1, news]
    schedule_hint: daily
    entry:
      feeds:
        - https://www.defensenews.com/arc/outboundfeeds/rss/?outputType=xml
      keywords: &anduril_news_keywords
        - Anduril
        - Roadrunner-M
        - Menace-X
        - Dive-LD
        - Barracuda
        - ALTIUS
    policy:
      robots_url: https://www.defensenews.com/robots.txt
      robots_checked_at: "2026-08-03"
      allowed_methods: [GET]
      rate_limit_seconds: 3.0
      max_concurrency: 1
      auth: none
      content_license: "Defense News copyright; research copy only, no redistribution"
      notes: "Arc RSS is discovery only; canonical article page is fetched as the body."

